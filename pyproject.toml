[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meetfind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "googlemaps>=4.10.0",
    "numpy>=2.2.5",
    "pyperclip>=1.9.0",
    "tabulate>=0.9.0",
    "textual>=3.2.0",
]

[project.scripts]
meetfind = "main:main"

[tool.hatch.build]
include = [
    "main.py",
    "modules/" 
]

